<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Explore Wikipedia as a map of linked articles."><title>Wiki Atlas</title><link rel="stylesheet" href="./style.css"></head>
<body><header class="top"><div class="brand"><span class="mark" aria-hidden="true">✳</span><div><strong data-ui="brand">无限百科</strong><small>WIKI ATLAS</small></div></div><form id="search" role="search"><label class="sr" for="query" data-ui="search-label">搜索维基百科</label><input id="query" placeholder="搜词条，比如 Hades" autocomplete="off" required maxlength="150"><select id="language" aria-label="维基百科语言"><option value="en">English</option><option value="zh">中文</option></select><button type="submit" data-ui="search">搜索</button><div id="results" hidden></div></form><div class="top-actions"><select id="ui-language" aria-label="界面语言"><option value="zh">中文</option><option value="en">English</option></select><button id="list-toggle" aria-pressed="false"><span data-ui="reading-list">阅读清单</span> <b id="count">0</b></button></div></header>
<main><section id="map" aria-label="词条地图，拖动平移，滚轮缩放" tabindex="0"><div class="map-info"><div class="eyebrow">THE LINK MAP</div><h1 data-ui="heading">顺着链接走。</h1><div id="map-status" role="status">正在点亮起点…</div></div><svg id="lines" aria-hidden="true"></svg><div id="nodes"></div><div class="map-footer"><div class="navigation-foot"><div class="map-history" role="group" aria-label="词条浏览历史" id="map-history"><button id="trail-back" disabled data-ui="trail-back">返回</button><button id="trail-next" disabled data-ui="trail-next">前进</button></div><div class="hint" data-ui="hint">拖动探索 · 滚轮缩放 · 点击词条</div></div><div class="zoom"><button id="minus" aria-label="缩小">−</button><button id="recenter" aria-label="回到当前词条">◎</button><button id="plus" aria-label="放大">+</button></div></div></section>
<aside id="reader"><div class="tabs"><button id="read-tab" aria-pressed="true" data-ui="current">当前词条</button><button id="saved-tab" aria-pressed="false" data-ui="reading-list">阅读清单</button></div><section id="detail" aria-live="polite"></section><section id="saved" hidden></section><footer class="credit"><span data-ui="credit-a">正文及图像来自 </span><a data-ui="wiki" href="https://www.wikipedia.org/" target="_blank" rel="noopener">维基百科</a><span data-ui="credit-b">。图片出处见词条。</span></footer></aside></main>
<script type="module" src="./app.mjs"></script></body></html>
